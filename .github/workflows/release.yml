name: Release OCI and SIF

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ github.ref_name }}
          provenance: false
          sbom: false
      - uses: eWaterCycle/setup-apptainer@v2
        with:
          apptainer-version: 1.4.2
      - run: apptainer build miry-data-collector.sif docker://ghcr.io/${{ github.repository }}@${{ steps.image.outputs.digest }}
      - name: Prepare deployment artifacts
        run: |
          sha256sum miry-data-collector.sif > miry-data-collector.sif.sha256
          printf '%s\n' \
            'ghcr.io/${{ github.repository }}@${{ steps.image.outputs.digest }}' \
            > edge-image.txt
      - env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}"
          miry-data-collector.sif
          miry-data-collector.sif.sha256
          edge-image.txt
          --generate-notes
