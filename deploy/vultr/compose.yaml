name: ft-shadow-data-plane

services:
  collector:
    image: ${EDGE_IMAGE:?EDGE_IMAGE must be an immutable image digest}
    command: ["--config", "/etc/ft-data/edge.yaml"]
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    volumes:
      - ${EDGE_DATA_ROOT:-/srv/ft-data-rsync}:/data
      - ${EDGE_CONFIG:-/etc/ft-shadow-data-plane/edge.yaml}:/etc/ft-data/edge.yaml:ro
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 768m
    cpus: 1.00
    stop_grace_period: 2m
    restart: "no"
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
